name: conductor
version: "0.4.1"
description: "Conductor leads Hermes, Claude Code, Codex, Grok Build, OpenCode, and Pycode. It waits for a run to finish, then follows up only while the user still wants the work going. No approval-bypass flags."
author: Alex
license: MIT
requires_hermes: ">=0.22.0"
provides_tools:
  - conductor_doctor
  - conductor_run
  - conductor_read
  - conductor_peek
  - conductor_wait
  - conductor_steer
  - conductor_stop
provides_hooks:
  - transform_llm_output
