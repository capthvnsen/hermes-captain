name: conductor
version: "0.8.1"
description: "Conductor starts Claude in T3, waits with no model, then peeks. A second peek stays quiet. It can also lead Hermes, Claude Code, Codex, Grok Build, OpenCode, and Pycode. No approval-bypass flags."
author: Alex
license: MIT
requires_hermes: ">=0.22.0"
provides_tools:
  - conductor_doctor
  - conductor_run
  - conductor_mode
  - conductor_read
  - conductor_peek
  - conductor_wait
  - conductor_steer
  - conductor_stop
  - conductor_watch
provides_hooks:
  - transform_llm_output
