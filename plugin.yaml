name: conductor
version: "0.8.4"
description: "Hermes starts a coding agent in T3 Code, Orca, or a terminal. It waits without spending model tokens and delivers the agent's answer back into the chat."
author: Alex
license: MIT
requires_hermes: ">=0.22.0"
provides_tools:
  - conductor_doctor
  - conductor_run
  - conductor_mode
  - conductor_read
  - conductor_peek
  - conductor_wait
  - conductor_steer
  - conductor_stop
  - conductor_watch
provides_hooks:
  - transform_llm_output
